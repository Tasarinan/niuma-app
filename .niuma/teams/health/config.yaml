id: health
defaultAgent: guide.md

roles:
  - agentFile: guide.md
    name: 健康向导
    commands:
      - profile
      - record
      - search
  - agentFile: analyst.md
    name: 报告分析师
    skills:
      - ima-skill
      - ai-analyzer
    commands:
      - analyze
  - agentFile: nutritionist.md
    name: 营养顾问
    skills:
      - nutrition-analyzer
      - food-database-query
  - agentFile: mental.md
    name: 身心顾问
    skills:
      - mental-health-analyzer
      - sleep-analyzer
  - agentFile: doctor.md
    name: 全科医生
    skills:
      - ima-skill
      - family-health-analyzer
      - emergency-card
      - health-trend-analyzer
      - wellally-tech
    commands:
      - report
