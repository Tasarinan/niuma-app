name: 会议
description: 会前准备、会中记录、会后纪要与行动项、同步消息。
eyebrow: 准备 · 记录 · 跟进
avatar: "🎯"
accent: sky
view: meeting
workflow: meeting

starterPrompts:
  - 把这次会议整理成纪要和行动项
  - 根据会议内容提炼决策、风险和下一步
  - 生成会后给团队的同步消息

roles:
  - agentFile: facilitator.md
    summary: 议程、分工、会中协调
  - agentFile: noter.md
    summary: 会中要点记录
  - agentFile: summarizer.md
    summary: 会后纪要
  - agentFile: tracker.md
    summary: 行动项与负责人
  - agentFile: communicator.md
    summary: 会后同步消息
