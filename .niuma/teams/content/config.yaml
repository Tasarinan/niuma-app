# 团队注册表：谁入职、谁有哪些技能和命令。
# 频道名、头像、文风在 presets/。

id: content
defaultAgent: producer.md

roles:
  - agentFile: producer.md
    name: 主理人
    skills:
      - article-main
    commands:
      - article
  - agentFile: desk.md
    name: 采编
    skills:
      - article-topics
  - agentFile: writer.md
    name: 写手
    skills:
      - article-writing
  - agentFile: illustrator.md
    name: 配图师
    skills:
      - article-images
    commands:
      - image
  - agentFile: chief.md
    name: 主编
    skills:
      - article-review
  - agentFile: publisher.md
    name: 发行
    skills:
      - article-formatting-wechat
      - article-formatting-xhs
      - article-formatting-zhihu
      - article-publish-wechat
      - article-publish-xhs
      - article-publish-zhihu
      - article-assets
    commands:
      - format
      - publish
