# 工作台展示与运行偏好，不参与 agents/skills/commands 注册。

name: 内容创作
description: 编辑部。主理人 /article 管稿；采编选题；写手写 Markdown；主编审稿；配图师 /image 与配图；发行 /format /publish。
eyebrow: Markdown · 多平台
avatar: "✍️"
accent: amber
workflow: content
workspaceRoot: true
dataDomain: contentbook

starterPrompts:
  - "/article create 今天想做一篇什么"
  - "/article create 开一篇乾坤AI路书（讲一个工具）"
  - "/article edit"
  - "/format WECHAT"
  - "/publish WECHAT"

roles:
  - agentFile: producer.md
    summary: 开新题、续旧稿、主持、定题、建目录、点名
  - agentFile: desk.md
    summary: remix 简报、拆角度、拟标题；不定题、不写稿
  - agentFile: writer.md
    summary: 写/改 article.md（Markdown）
  - agentFile: illustrator.md
    summary: 生/搜 PNG 到 imgs/，/image 整理目录图，改文中图片引用
  - agentFile: chief.md
    summary: 审 article.md，写 review.md
  - agentFile: publisher.md
    summary: 同一篇 Markdown 排到 WECHAT/XHS/ZHIHU，或推到对应草稿箱
