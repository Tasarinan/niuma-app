# Ported from wechat-auto-writer (nested styles → format.py CSS strings)
name: "马卡龙丁香"
description: "浪漫优雅的马卡龙丁香色系，柔和低饱和度，适合时尚、美妆、婚礼类文章"
source: wechat-auto-writer

variables:
  primary-color: "#d946ef"
  bg-accent-color: "#fae8ff"
  text-color: "#0f172a"
  text-light: "#64748b"
  link-color: "#d946ef"
  font-size: "16px"
  line-height: "1.75"
  font-family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"

styles:
  container: "max-width: 740px; margin: 0 auto; font-size: 16px; line-height: 1.75; letter-spacing: 0px; padding: 0 16px; color: #0f172a; background-color: #ffffff"
  h1: "font-size: 24px; font-weight: normal; margin: 0 0 8px 0; padding: 0 16px; text-align: center; color: #d946ef"
  h2: "font-size: 20.8px; font-weight: bold; margin: 0 0 6px 0; padding: 0 16px; color: #0f172a"
  h3: "font-size: 20.8px; font-weight: bold; margin: 0 0 4px 0; padding: 0 16px; color: #0f172a"
  h4: "font-size: 19.2px; font-weight: bold; margin: 0 0 4px 0; padding: 0 16px; color: #64748b"
  p: "margin: 0 0 10px 0; line-height: 1.75; color: #0f172a; font-size: 16px; letter-spacing: 0px"
  strong: "font-weight: bold; color: #d946ef"
  em: "font-style: italic; color: #64748b"
  a: "color: #d946ef; text-decoration: underline"
  ul: "font-size: 16px; margin: 10px 0; padding: 0 16px 0 32px; line-height: 1.75; color: #0f172a"
  ol: "font-size: 16px; margin: 10px 0; padding: 0 16px 0 32px; line-height: 1.75; color: #0f172a"
  li: "font-size: 16px; line-height: 1.75; color: #0f172a; margin-bottom: 6px"
  blockquote: "font-size: 14.4px; padding: 8px 10px; margin: 16px 0; border-left: 4px solid #d946ef; background: #fdf4ff; border-radius: 0 5px 5px 0; line-height: 1.75; color: #0f172a"
  hr: "border: none; border-top: 1px solid #ddd; margin: 20px auto"
  img: "border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); max-width: 100%; height: auto; display: block; margin: 16px auto"
  code: "font-size: 12.5px; padding: 4px 6px; border-radius: 3px; background: #fdf4ff; color: #d946ef"
  pre: "font-size: 14px; line-height: 2; margin: 10px 4px; padding: 8px; border-radius: 5px; background: #fdf4ff; color: #0f172a"
  table: "font-size: 12px; border-collapse: collapse; width: 100%; margin: 10px 0"
  th: "padding: 9px 12px; line-height: 22px; font-weight: bold; background: #fae8ff; color: #0f172a; border: 1px solid #f0abfc"
  td: "padding: 9px 12px; line-height: 22px; color: #0f172a; border: 1px solid #f0abfc"
  strong-color: "#d946ef"
  figcaption: "text-align: center; font-size: 12px; color: #64748b; margin-top: 6px"
