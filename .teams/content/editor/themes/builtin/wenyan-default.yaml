# Ported from wechat-auto-writer (nested styles → format.py CSS strings)
name: "文颜默认"
description: "简洁经典的黑白灰配色，蓝色点缀，适合长文阅读，文颜项目默认主题"
source: wechat-auto-writer

variables:
  primary-color: "#2563eb"
  bg-accent-color: "#dbeafe"
  text-color: "#1f2937"
  text-light: "#6b7280"
  link-color: "#2563eb"
  font-size: "16px"
  line-height: "1.75"
  font-family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"

styles:
  container: "max-width: 740px; margin: 0 auto; font-size: 16px; line-height: 1.75; letter-spacing: 0px; padding: 0 16px; color: #1f2937; background-color: #ffffff"
  h1: "font-size: 24px; font-weight: normal; margin: 0 0 8px 0; padding: 0 16px; text-align: center; color: #1f2937"
  h2: "font-size: 20.8px; font-weight: bold; margin: 0 0 6px 0; padding: 0 16px; color: #1f2937"
  h3: "font-size: 20.8px; font-weight: bold; margin: 0 0 4px 0; padding: 0 16px; color: #1f2937"
  h4: "font-size: 19.2px; font-weight: bold; margin: 0 0 4px 0; padding: 0 16px; color: #6b7280"
  p: "margin: 0 0 10px 0; line-height: 1.75; color: #1f2937; font-size: 16px; letter-spacing: 0px"
  strong: "font-weight: bold; color: #1f2937"
  em: "font-style: italic; color: #6b7280"
  a: "color: #2563eb; text-decoration: underline"
  ul: "font-size: 16px; margin: 10px 0; padding: 0 16px 0 32px; line-height: 1.75; color: #1f2937"
  ol: "font-size: 16px; margin: 10px 0; padding: 0 16px 0 32px; line-height: 1.75; color: #1f2937"
  li: "font-size: 16px; line-height: 1.75; color: #1f2937; margin-bottom: 6px"
  blockquote: "font-size: 14.4px; padding: 8px 10px; margin: 16px 0; border-left: 4px solid #2563eb; background: #f8fafc; border-radius: 0 5px 5px 0; line-height: 1.75; color: #374151"
  hr: "border: none; border-top: 1px solid #ddd; margin: 20px auto"
  img: "border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); max-width: 100%; height: auto; display: block; margin: 16px auto"
  code: "font-size: 12.5px; padding: 4px 6px; border-radius: 3px; background: #f1f5f9; color: #2563eb"
  pre: "font-size: 14px; line-height: 2; margin: 10px 4px; padding: 8px; border-radius: 5px; background: #f8fafc; color: #1f2937"
  table: "font-size: 12px; border-collapse: collapse; width: 100%; margin: 10px 0"
  th: "padding: 9px 12px; line-height: 22px; font-weight: bold; background: #f1f5f9; color: #1f2937; border: 1px solid #e2e8f0"
  td: "padding: 9px 12px; line-height: 22px; color: #374151; border: 1px solid #e2e8f0"
  strong-color: "#1f2937"
  figcaption: "text-align: center; font-size: 12px; color: #6b7280; margin-top: 6px"
