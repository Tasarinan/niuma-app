# Ported from wechat-auto-writer (nested styles → format.py CSS strings)
name: "文颜橙心"
description: "温暖橙色调主题，活力优雅，适合美食、旅行、生活、情感类文章"
source: wechat-auto-writer

variables:
  primary-color: "#f97316"
  bg-accent-color: "#fed7aa"
  text-color: "#1c1917"
  text-light: "#78716c"
  link-color: "#ea580c"
  font-size: "16px"
  line-height: "1.75"
  font-family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"

styles:
  container: "max-width: 740px; margin: 0 auto; font-size: 16px; line-height: 1.75; letter-spacing: 0px; padding: 0 16px; color: #1c1917; background-color: #ffffff"
  h1: "font-size: 24px; font-weight: normal; margin: 0 0 8px 0; padding: 0 16px; text-align: center; color: #ea580c"
  h2: "font-size: 20.8px; font-weight: bold; margin: 0 0 6px 0; padding: 0 16px; color: #1c1917"
  h3: "font-size: 20.8px; font-weight: bold; margin: 0 0 4px 0; padding: 0 16px; color: #1c1917"
  h4: "font-size: 19.2px; font-weight: bold; margin: 0 0 4px 0; padding: 0 16px; color: #78716c"
  p: "margin: 0 0 10px 0; line-height: 1.75; color: #1c1917; font-size: 16px; letter-spacing: 0px"
  strong: "font-weight: bold; color: #ea580c"
  em: "font-style: italic; color: #78716c"
  a: "color: #ea580c; text-decoration: underline"
  ul: "font-size: 16px; margin: 10px 0; padding: 0 16px 0 32px; line-height: 1.75; color: #1c1917"
  ol: "font-size: 16px; margin: 10px 0; padding: 0 16px 0 32px; line-height: 1.75; color: #1c1917"
  li: "font-size: 16px; line-height: 1.75; color: #1c1917; margin-bottom: 6px"
  blockquote: "font-size: 14.4px; padding: 8px 10px; margin: 16px 0; border-left: 4px solid #f97316; background: #fff7ed; border-radius: 0 5px 5px 0; line-height: 1.75; color: #44403c"
  hr: "border: none; border-top: 1px solid #ddd; margin: 20px auto"
  img: "border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); max-width: 100%; height: auto; display: block; margin: 16px auto"
  code: "font-size: 12.5px; padding: 4px 6px; border-radius: 3px; background: #ffedd5; color: #c2410c"
  pre: "font-size: 14px; line-height: 2; margin: 10px 4px; padding: 8px; border-radius: 5px; background: #fff7ed; color: #1c1917"
  table: "font-size: 12px; border-collapse: collapse; width: 100%; margin: 10px 0"
  th: "padding: 9px 12px; line-height: 22px; font-weight: bold; background: #ffedd5; color: #1c1917; border: 1px solid #fdba74"
  td: "padding: 9px 12px; line-height: 22px; color: #44403c; border: 1px solid #fdba74"
  strong-color: "#ea580c"
  figcaption: "text-align: center; font-size: 12px; color: #78716c; margin-top: 6px"
