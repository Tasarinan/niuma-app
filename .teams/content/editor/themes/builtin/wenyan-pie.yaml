# Ported from wechat-auto-writer (nested styles → format.py CSS strings)
name: "文颜派"
description: "现代锐利时尚风格，灵感来自少数派sspai，适合科技评论、深度分析"
source: wechat-auto-writer

variables:
  primary-color: "#dc2626"
  bg-accent-color: "#fef2f2"
  text-color: "#18181b"
  text-light: "#71717a"
  link-color: "#dc2626"
  font-size: "16px"
  line-height: "1.75"
  font-family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"

styles:
  container: "max-width: 740px; margin: 0 auto; font-size: 16px; line-height: 1.75; letter-spacing: 0px; padding: 0 16px; color: #18181b; background-color: #ffffff"
  h1: "font-size: 24px; font-weight: normal; margin: 0 0 8px 0; padding: 0 16px; text-align: center; color: #18181b"
  h2: "font-size: 20.8px; font-weight: bold; margin: 0 0 6px 0; padding: 0 16px; color: #18181b"
  h3: "font-size: 20.8px; font-weight: bold; margin: 0 0 4px 0; padding: 0 16px; color: #18181b"
  h4: "font-size: 19.2px; font-weight: bold; margin: 0 0 4px 0; padding: 0 16px; color: #71717a"
  p: "margin: 0 0 10px 0; line-height: 1.75; color: #18181b; font-size: 16px; letter-spacing: 0px"
  strong: "font-weight: bold; color: #18181b"
  em: "font-style: italic; color: #71717a"
  a: "color: #dc2626; text-decoration: underline"
  ul: "font-size: 16px; margin: 10px 0; padding: 0 16px 0 32px; line-height: 1.75; color: #18181b"
  ol: "font-size: 16px; margin: 10px 0; padding: 0 16px 0 32px; line-height: 1.75; color: #18181b"
  li: "font-size: 16px; line-height: 1.75; color: #18181b; margin-bottom: 6px"
  blockquote: "font-size: 14.4px; padding: 8px 10px; margin: 16px 0; border-left: 4px solid #dc2626; background: #fafafa; border-radius: 0 5px 5px 0; line-height: 1.75; color: #3f3f46"
  hr: "border: none; border-top: 1px solid #ddd; margin: 20px auto"
  img: "border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); max-width: 100%; height: auto; display: block; margin: 16px auto"
  code: "font-size: 12.5px; padding: 4px 6px; border-radius: 3px; background: #f4f4f5; color: #dc2626"
  pre: "font-size: 14px; line-height: 2; margin: 10px 4px; padding: 8px; border-radius: 5px; background: #fafafa; color: #18181b"
  table: "font-size: 12px; border-collapse: collapse; width: 100%; margin: 10px 0"
  th: "padding: 9px 12px; line-height: 22px; font-weight: bold; background: #f4f4f5; color: #18181b; border: 1px solid #d4d4d8"
  td: "padding: 9px 12px; line-height: 22px; color: #3f3f46; border: 1px solid #d4d4d8"
  strong-color: "#18181b"
  figcaption: "text-align: center; font-size: 12px; color: #71717a; margin-top: 6px"
